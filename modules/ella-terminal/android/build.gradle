buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.13.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21"
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.3.21"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply from: "../nitrogen/generated/android/EllaTerminal+autolinking.gradle"
apply from: "./fix-prefab.gradle"

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["EllaTerminal_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["EllaTerminal_" + name].toInteger()
}

android {
  namespace "com.margelo.nitro.ella.terminal"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug { cppFlags "-O1 -g" }
          release { cppFlags "-O2" }
        }
      }
    }
  }

  externalNativeBuild {
    cmake { path "CMakeLists.txt" }
  }

  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libc++_shared.so",
      "**/libNitroModules.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermes.so",
      "**/libhermes-executor-debug.so",
      "**/libhermes_executor.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libturbomodulejsijni.so",
      "**/libreact_nativemodule_core.so",
      "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    compose true
    prefab true
  }

  buildTypes {
    release { minifyEnabled false }
  }

  lintOptions { disable "GradleCompatible" }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }

  kotlinOptions { jvmTarget = "17" }

}

repositories {
  google()
  mavenCentral()
}

dependencies {
  compileOnly "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")
  implementation platform("androidx.compose:compose-bom:2026.05.01")
  implementation "androidx.compose.foundation:foundation"
  implementation "androidx.compose.ui:ui"
  implementation "com.hierynomus:sshj:0.40.0"
  implementation "org.connectbot:termlib:0.1.0"
  testImplementation "junit:junit:4.13.2"
  coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
